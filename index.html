<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="그린북">
<meta name="theme-color" content="#1f3a2e">
<title>그린북 — 나의 스코어카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
:root {
  --cream: #f5efe1;
  --cream-soft: #faf6ec;
  --ivory: #fdfaf2;
  --pine: #1f3a2e;
  --pine-deep: #14271f;
  --pine-soft: #2d5240;
  --brass: #a68628;
  --brass-soft: #c9a849;
  --ink: #181613;
  --ink-soft: #4a453d;
  --muted: #8a8275;
  --line: #d9d1be;
  --line-soft: #e8e1cf;
  --danger: #8a3a2a;
  --shadow: 0 1px 2px rgba(20, 39, 31, 0.04), 0 4px 16px rgba(20, 39, 31, 0.06);
  --serif: 'Fraunces', 'Cormorant Garamond', ui-serif, Georgia, serif;
  --sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  background: var(--cream);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.5;
  font-feature-settings: 'ss01', 'ss02';
  overscroll-behavior-y: contain;
  padding-bottom: env(safe-area-inset-bottom);
}

/* Subtle paper texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(rgba(166, 134, 40, 0.025) 1px, transparent 1px);
  background-size: 3px 3px;
  z-index: 0;
}

#app { position: relative; z-index: 1; min-height: 100vh; padding-bottom: 96px; }

/* Header */
header {
  padding: calc(env(safe-area-inset-top) + 24px) 24px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--cream);
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-row { display: flex; justify-content: space-between; align-items: baseline; }
.brand {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 26px;
  letter-spacing: -0.02em;
  color: var(--pine);
  font-style: italic;
}
.brand-sub {
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--brass);
  margin-top: 2px;
  font-weight: 500;
}
.view-title {
  font-family: var(--serif);
  font-size: 13px;
  font-style: italic;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
}

/* Sections */
main { padding: 24px 20px 40px; }
.section { margin-bottom: 36px; }
.section-label {
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}

/* Cards */
.card {
  background: var(--ivory);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 20px;
  box-shadow: var(--shadow);
}

/* Hero / Start round card */
.hero-card {
  background: var(--pine);
  color: var(--cream);
  border-radius: 6px;
  padding: 28px 24px;
  position: relative;
  overflow: hidden;
}
.hero-card::after {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(201, 168, 73, 0.18), transparent 70%);
}
.hero-eyebrow {
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--brass-soft);
  margin-bottom: 8px;
}
.hero-title {
  font-family: var(--serif);
  font-size: 28px;
  line-height: 1.15;
  font-weight: 500;
  margin-bottom: 4px;
  letter-spacing: -0.01em;
}
.hero-meta { font-size: 13px; color: rgba(245, 239, 225, 0.7); margin-bottom: 20px; }
.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--brass);
  color: var(--pine-deep);
  border: none;
  padding: 12px 22px;
  border-radius: 3px;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.12s ease;
}
.hero-cta:active { transform: scale(0.97); }
.hero-cta.secondary {
  background: transparent;
  color: var(--cream);
  border: 1px solid rgba(245, 239, 225, 0.3);
}

/* Quick stats */
.quick-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
.stat {
  background: var(--ivory);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 16px 14px;
  text-align: center;
}
.stat-num {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 500;
  color: var(--pine);
  letter-spacing: -0.02em;
  line-height: 1;
}
.stat-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 6px;
}

/* Scorecard */
.scorecard-header {
  display: grid;
  grid-template-columns: 60px 1fr 1fr 1fr;
  padding: 0 16px 10px;
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.scorecard-header > div:not(:first-child) { text-align: center; }

.hole-row {
  background: var(--ivory);
  border: 1px solid var(--line);
  border-bottom: none;
  display: grid;
  grid-template-columns: 60px 1fr 1fr 1fr;
  align-items: center;
  padding: 14px 16px;
  cursor: pointer;
  transition: background 0.12s;
}
.hole-row:first-child { border-radius: 4px 4px 0 0; }
.hole-row:last-of-type { border-bottom: 1px solid var(--line); border-radius: 0 0 4px 4px; }
.hole-row:active { background: var(--cream-soft); }
.hole-row.expanded {
  background: var(--cream-soft);
  border-radius: 0;
}

.hole-num {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  color: var(--pine);
}
.hole-num small {
  display: block;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: normal;
  margin-top: 2px;
}
.hole-cell { text-align: center; font-family: var(--serif); font-size: 19px; color: var(--ink); }
.hole-cell.empty { color: var(--line); }
.hole-cell-label {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

/* Score color coding vs par */
.diff-eagle { color: var(--brass); font-weight: 600; }
.diff-birdie { color: #d4791e; font-weight: 600; }
.diff-par { color: var(--pine); }
.diff-bogey { color: var(--ink-soft); }
.diff-double { color: var(--danger); }

/* Hole detail (expanded) */
.hole-detail {
  background: var(--cream-soft);
  border: 1px solid var(--line);
  border-top: none;
  padding: 20px 16px 22px;
  animation: slideDown 0.18s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 18px;
}
.detail-block {
  background: var(--ivory);
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  padding: 14px;
  text-align: center;
}
.detail-block-label {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.counter {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.counter-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--ivory);
  color: var(--pine);
  font-size: 20px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  line-height: 1;
}
.counter-btn:active { background: var(--pine); color: var(--cream); }
.counter-btn:disabled { opacity: 0.3; }
.counter-val {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 500;
  color: var(--pine);
  min-width: 36px;
  line-height: 1;
}

/* Shot tracker */
.shots-section { margin-bottom: 18px; }
.shots-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}
.shot-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  background: var(--ivory);
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  font-size: 13px;
}
.shot-num {
  font-family: var(--serif);
  font-style: italic;
  color: var(--brass);
  margin-right: 10px;
  font-size: 14px;
}
.shot-club { font-weight: 500; color: var(--ink); }
.shot-result { color: var(--ink-soft); margin-left: 8px; }
.shot-delete {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}

.add-shot-btn {
  width: 100%;
  background: transparent;
  border: 1px dashed var(--line);
  color: var(--ink-soft);
  padding: 12px;
  border-radius: 3px;
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
}
.add-shot-btn:active { background: var(--cream); }

/* Shot picker */
.shot-picker {
  margin-top: 10px;
  padding: 14px;
  background: var(--ivory);
  border: 1px solid var(--line);
  border-radius: 3px;
}
.picker-row { margin-bottom: 12px; }
.picker-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.chip-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  background: var(--cream-soft);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 7px 12px;
  border-radius: 100px;
  font-size: 12px;
  font-family: var(--sans);
  cursor: pointer;
  transition: all 0.1s;
}
.chip:active { transform: scale(0.96); }
.chip.selected {
  background: var(--pine);
  color: var(--cream);
  border-color: var(--pine);
}
.picker-actions { display: flex; gap: 8px; margin-top: 8px; }
.btn-primary {
  flex: 1;
  background: var(--pine);
  color: var(--cream);
  border: none;
  padding: 10px;
  border-radius: 3px;
  font-family: var(--sans);
  font-weight: 500;
  font-size: 13px;
  cursor: pointer;
}
.btn-secondary {
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--line);
  padding: 10px 14px;
  border-radius: 3px;
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
}

/* Notes */
.notes-block { margin-top: 4px; }
.notes-input {
  width: 100%;
  background: var(--ivory);
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  padding: 10px 12px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  resize: vertical;
  min-height: 60px;
}
.notes-input:focus { outline: none; border-color: var(--pine-soft); }

/* Total row */
.total-row {
  margin-top: 12px;
  display: grid;
  grid-template-columns: 60px 1fr 1fr 1fr;
  align-items: center;
  padding: 16px;
  background: var(--pine);
  color: var(--cream);
  border-radius: 4px;
}
.total-row .hole-num { color: var(--cream); font-style: italic; font-size: 18px; }
.total-row .hole-num small { color: var(--brass-soft); }
.total-row .hole-cell { color: var(--cream); font-weight: 500; }

/* Round actions */
.round-actions {
  display: flex;
  gap: 10px;
  margin-top: 28px;
}
.round-actions button { flex: 1; padding: 14px; }

/* History items */
.history-item {
  background: var(--ivory);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 16px 18px;
  margin-bottom: 10px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  cursor: pointer;
}
.history-item:active { background: var(--cream-soft); }
.history-date {
  font-family: var(--serif);
  font-size: 17px;
  color: var(--pine);
  font-weight: 500;
}
.history-meta {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-top: 4px;
  text-transform: uppercase;
}
.history-score {
  font-family: var(--serif);
  font-size: 28px;
  color: var(--pine);
  font-weight: 500;
  text-align: right;
  line-height: 1;
}
.history-diff {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  margin-top: 4px;
  text-align: right;
}

/* Stats charts */
.chart-card {
  background: var(--ivory);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 20px;
  margin-bottom: 16px;
}
.chart-title {
  font-family: var(--serif);
  font-size: 15px;
  font-style: italic;
  color: var(--pine);
  margin-bottom: 4px;
}
.chart-subtitle {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 18px;
}
svg.chart { width: 100%; height: auto; display: block; }

/* Settings */
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--line-soft);
}
.setting-row:last-child { border-bottom: none; }
.setting-label { font-size: 14px; color: var(--ink); }
.setting-input {
  background: var(--cream-soft);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 8px 12px;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--ink);
  width: 60px;
  text-align: center;
}
.setting-input.wide { width: 180px; text-align: left; }
.setting-input:focus { outline: none; border-color: var(--pine-soft); }

/* Empty state */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-icon {
  font-family: var(--serif);
  font-size: 56px;
  color: var(--brass-soft);
  font-style: italic;
  margin-bottom: 12px;
}
.empty-text { font-size: 14px; }

/* Bottom navigation */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--ivory);
  border-top: 1px solid var(--line);
  display: flex;
  padding: 8px 0 calc(env(safe-area-inset-bottom) + 8px);
  z-index: 20;
}
.nav-btn {
  flex: 1;
  background: none;
  border: none;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  color: var(--muted);
  font-family: var(--sans);
}
.nav-btn.active { color: var(--pine); }
.nav-icon { font-family: var(--serif); font-size: 18px; font-style: italic; line-height: 1; }
.nav-label { font-size: 10px; letter-spacing: 0.06em; }

/* Confirm dialog */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(20, 39, 31, 0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 20px;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--ivory);
  border-radius: 6px;
  padding: 24px;
  max-width: 320px;
  width: 100%;
  box-shadow: 0 12px 40px rgba(20, 39, 31, 0.25);
}
.modal-title {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 500;
  color: var(--pine);
  margin-bottom: 8px;
}
.modal-text { font-size: 14px; color: var(--ink-soft); margin-bottom: 20px; }
.modal-actions { display: flex; gap: 8px; }
.modal-actions button { flex: 1; padding: 10px; }
.btn-danger { background: var(--danger); color: var(--cream); border: none; border-radius: 3px; font-family: var(--sans); cursor: pointer; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="header-row">
      <div>
        <div class="brand">Greenbook</div>
        <div class="brand-sub">— 그린북 —</div>
      </div>
      <div class="view-title" id="viewTitle"></div>
    </div>
  </header>

  <main id="main"></main>

  <nav class="bottom-nav" id="nav"></nav>
</div>

<div id="modalRoot"></div>

<script>
/* ============================================================
   상태 관리 & 저장소
   ============================================================ */
const STORAGE_KEY = 'greenbook_v1';

const defaultPars = [4, 4, 3, 4, 5, 3, 4, 3, 5]; // Leo의 9홀 코스 (합계 파 35)

const state = {
  view: 'home', // home | round | history | stats | settings | roundDetail
  rounds: [],
  settings: {
    courseName: '',
    pars: [...defaultPars]
  },
  currentRoundId: null,
  expandedHole: null,
  shotPicker: null,        // { holeIdx, club, result }
  viewingRoundId: null
};

const CLUBS = ['드라이버','3W','5W','유틸','4i','5i','6i','7i','8i','9i','PW','GW','SW','LW','퍼터'];
const RESULTS = ['페어웨이','러프','벙커','그린','홀인','OB','해저드'];

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      state.rounds = data.rounds || [];
      state.settings = { ...state.settings, ...(data.settings || {}) };
      state.currentRoundId = data.currentRoundId || null;
    }
  } catch (e) { console.error('load error', e); }
}
function save() {
  const payload = {
    rounds: state.rounds,
    settings: state.settings,
    currentRoundId: state.currentRoundId
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
}

function getCurrentRound() {
  return state.rounds.find(r => r.id === state.currentRoundId) || null;
}
function getRound(id) {
  return state.rounds.find(r => r.id === id) || null;
}

function newRound() {
  const round = {
    id: 'r_' + Date.now(),
    date: new Date().toISOString(),
    courseName: state.settings.courseName,
    holes: state.settings.pars.map((par, i) => ({
      number: i + 1,
      par,
      score: null,
      putts: null,
      shots: [],
      notes: ''
    })),
    completed: false
  };
  state.rounds.unshift(round);
  state.currentRoundId = round.id;
  state.expandedHole = 0;
  save();
}

function finishRound() {
  const round = getCurrentRound();
  if (!round) return;
  round.completed = true;
  state.currentRoundId = null;
  state.expandedHole = null;
  save();
}

function discardRound() {
  if (!state.currentRoundId) return;
  state.rounds = state.rounds.filter(r => r.id !== state.currentRoundId);
  state.currentRoundId = null;
  state.expandedHole = null;
  save();
}

function deleteRound(id) {
  state.rounds = state.rounds.filter(r => r.id !== id);
  if (state.viewingRoundId === id) state.viewingRoundId = null;
  save();
}

/* ============================================================
   유틸
   ============================================================ */
function fmtDate(iso) {
  const d = new Date(iso);
  const yr = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const da = String(d.getDate()).padStart(2, '0');
  return `${yr}.${mo}.${da}`;
}
function fmtDateLong(iso) {
  const d = new Date(iso);
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function totalScore(round) {
  return round.holes.reduce((s, h) => s + (h.score || 0), 0);
}
function totalPar(round) {
  return round.holes.reduce((s, h) => s + h.par, 0);
}
function totalPutts(round) {
  return round.holes.reduce((s, h) => s + (h.putts || 0), 0);
}
function diffClass(score, par) {
  if (score == null) return '';
  const d = score - par;
  if (d <= -2) return 'diff-eagle';
  if (d === -1) return 'diff-birdie';
  if (d === 0) return 'diff-par';
  if (d === 1) return 'diff-bogey';
  return 'diff-double';
}
function diffStr(score, par) {
  const d = score - par;
  if (d === 0) return 'E';
  return d > 0 ? `+${d}` : `${d}`;
}

/* ============================================================
   뷰 렌더링
   ============================================================ */
function setView(v, opts = {}) {
  state.view = v;
  if (opts.roundId) state.viewingRoundId = opts.roundId;
  state.expandedHole = null;
  state.shotPicker = null;
  render();
  window.scrollTo(0, 0);
}

function render() {
  renderHeader();
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = '';
  switch (state.view) {
    case 'home': renderHome(main); break;
    case 'round': renderRound(main); break;
    case 'history': renderHistory(main); break;
    case 'roundDetail': renderRoundDetail(main); break;
    case 'stats': renderStats(main); break;
    case 'settings': renderSettings(main); break;
  }
}

function renderHeader() {
  const titles = { home: '홈', round: '진행 중', history: '히스토리', stats: '통계', settings: '설정', roundDetail: '라운드 기록' };
  document.getElementById('viewTitle').textContent = titles[state.view] || '';
}

function renderNav() {
  const items = [
    { id: 'home', icon: 'H', label: '홈' },
    { id: 'history', icon: 'R', label: '기록' },
    { id: 'stats', icon: 'S', label: '통계' },
    { id: 'settings', icon: '⚙', label: '설정' }
  ];
  const nav = document.getElementById('nav');
  nav.innerHTML = items.map(it => {
    const active = (state.view === it.id) || (it.id === 'home' && state.view === 'round') || (it.id === 'history' && state.view === 'roundDetail');
    return `<button class="nav-btn ${active ? 'active' : ''}" data-nav="${it.id}">
      <span class="nav-icon">${it.icon}</span>
      <span class="nav-label">${it.label}</span>
    </button>`;
  }).join('');
  nav.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => setView(btn.dataset.nav));
  });
}

/* ---------- 홈 ---------- */
function renderHome(root) {
  const cur = getCurrentRound();
  const completed = state.rounds.filter(r => r.completed);

  let html = '';

  // Hero card
  if (cur) {
    const filled = cur.holes.filter(h => h.score != null).length;
    html += `
      <div class="hero-card">
        <div class="hero-eyebrow">진행 중</div>
        <div class="hero-title">${cur.courseName || '오늘의 라운드'}</div>
        <div class="hero-meta">${fmtDateLong(cur.date)} · ${filled}/9 홀 기록</div>
        <button class="hero-cta" data-act="resume">계속하기 →</button>
      </div>
    `;
  } else {
    html += `
      <div class="hero-card">
        <div class="hero-eyebrow">${last ? '다음 라운드' : '시작'}</div>
        <div class="hero-title">${state.settings.courseName || '오늘의 라운드'}</div>
        <div class="hero-meta">${fmtDateLong(new Date().toISOString())}</div>
        <button class="hero-cta" data-act="start">라운드 시작 →</button>
      </div>
    `;
  }

  // Quick stats
  if (completed.length > 0) {
    const scores = completed.map(r => totalScore(r));
    const best = Math.min(...scores);
    const avg = (scores.reduce((a,b)=>a+b,0) / scores.length).toFixed(1);
    html += `
      <div class="quick-stats" style="margin-top:24px">
        <div class="stat"><div class="stat-num">${completed.length}</div><div class="stat-label">라운드</div></div>
        <div class="stat"><div class="stat-num">${best}</div><div class="stat-label">베스트</div></div>
        <div class="stat"><div class="stat-num">${avg}</div><div class="stat-label">평균</div></div>
      </div>
    `;
  }

  // Recent rounds
  if (last) {
    html += `<div class="section-label">최근 라운드</div>`;
    completed.slice(0, 3).forEach(r => {
      const sc = totalScore(r);
      const par = totalPar(r);
      html += `
        <div class="history-item" data-round-id="${r.id}">
          <div>
            <div class="history-date">${fmtDate(r.date)}</div>
            <div class="history-meta">${r.courseName || '코스 미지정'}</div>
          </div>
          <div>
            <div class="history-score">${sc}</div>
            <div class="history-diff ${diffClass(sc, par)}">${diffStr(sc, par)}</div>
          </div>
        </div>
      `;
    });

    html += `
      <div class="empty">
        <div class="empty-icon">G</div>
        <div class="empty-text">아직 기록이 없습니다.<br>첫 라운드를 시작해 보세요.</div>
      </div>
    `;
  }

  root.innerHTML = html;

  root.querySelector('[data-act="start"]')?.addEventListener('click', () => {
    newRound();
    setView('round');
  });
  root.querySelector('[data-act="resume"]')?.addEventListener('click', () => setView('round'));
  root.querySelectorAll('[data-round-id]').forEach(el => {
    el.addEventListener('click', () => setView('roundDetail', { roundId: el.dataset.roundId }));
  });
}

/* ---------- 라운드 (진행 중) ---------- */
function renderRound(root) {
  const round = getCurrentRound();
  if (!round) {
    root.innerHTML = `
      <div class="empty">
        <div class="empty-icon">G</div>
        <div class="empty-text">진행 중인 라운드가 없습니다.</div>
      </div>
    `;
    return;
  }

  const tot = totalScore(round);
  const par = totalPar(round);
  const putts = totalPutts(round);

  let html = `
    <div class="section">
      <div class="section-label">${fmtDateLong(round.date)}</div>
      <div class="scorecard-header">
        <div>홀</div><div>파</div><div>스코어</div><div>퍼팅</div>
      </div>
  `;

  round.holes.forEach((h, i) => {
    const expanded = state.expandedHole === i;
    const scoreCell = h.score == null
      ? `<div class="hole-cell empty">—</div>`
      : `<div class="hole-cell ${diffClass(h.score, h.par)}">${h.score}</div>`;
    const puttsCell = h.putts == null
      ? `<div class="hole-cell empty">—</div>`
      : `<div class="hole-cell">${h.putts}</div>`;

    html += `
      <div class="hole-row ${expanded ? 'expanded' : ''}" data-hole="${i}">
        <div class="hole-num">${h.number}<small>HOLE</small></div>
        <div class="hole-cell">${h.par}</div>
        ${scoreCell}
        ${puttsCell}
      </div>
    `;
    if (expanded) {
      html += renderHoleDetail(h, i);
    }
  });

  html += `
      <div class="total-row">
        <div class="hole-num">합계<small>TOTAL</small></div>
        <div class="hole-cell">${par}</div>
        <div class="hole-cell">${tot || '—'}</div>
        <div class="hole-cell">${putts || '—'}</div>
      </div>
    </div>

    <div class="round-actions">
      <button class="btn-secondary" data-act="discard">라운드 취소</button>
      <button class="btn-primary" data-act="finish">라운드 종료</button>
    </div>
  `;

  root.innerHTML = html;

  root.querySelectorAll('.hole-row[data-hole]').forEach(el => {
    el.addEventListener('click', (e) => {
      // Don't toggle if click was inside expanded detail
      if (e.target.closest('.hole-detail')) return;
      const idx = parseInt(el.dataset.hole);
      state.expandedHole = state.expandedHole === idx ? null : idx;
      state.shotPicker = null;
      render();
    });
  });

  attachHoleDetailHandlers(root, round);

  root.querySelector('[data-act="finish"]')?.addEventListener('click', () => {
    confirmModal('라운드를 종료하시겠습니까?', '기록은 히스토리에 저장됩니다.', () => {
      finishRound();
      setView('home');
    });
  });
  root.querySelector('[data-act="discard"]')?.addEventListener('click', () => {
    confirmModal('라운드를 취소하시겠습니까?', '기록이 삭제됩니다.', () => {
      discardRound();
      setView('home');
    }, true);
  });
}

function renderHoleDetail(h, idx) {
  const picker = state.shotPicker && state.shotPicker.holeIdx === idx ? state.shotPicker : null;

  let shotsHtml = '';
  if (h.shots.length > 0) {
    shotsHtml = `<div class="shots-list">${h.shots.map((s, si) => `
      <div class="shot-item">
        <div>
          <span class="shot-num">${si + 1}.</span>
          <span class="shot-club">${s.club}</span>
          ${s.result ? `<span class="shot-result">→ ${s.result}</span>` : ''}
        </div>
        <button class="shot-delete" data-shot-del="${idx}-${si}" aria-label="삭제">×</button>
      </div>
    `).join('')}</div>`;
  }

  let pickerHtml = '';
  if (picker) {
    pickerHtml = `
      <div class="shot-picker">
        <div class="picker-row">
          <div class="picker-label">클럽</div>
          <div class="chip-grid">
            ${CLUBS.map(c => `<button class="chip ${picker.club === c ? 'selected' : ''}" data-pick-club="${c}">${c}</button>`).join('')}
          </div>
        </div>
        <div class="picker-row">
          <div class="picker-label">결과 (선택)</div>
          <div class="chip-grid">
            ${RESULTS.map(r => `<button class="chip ${picker.result === r ? 'selected' : ''}" data-pick-result="${r}">${r}</button>`).join('')}
          </div>
        </div>
        <div class="picker-actions">
          <button class="btn-secondary" data-pick-cancel>취소</button>
          <button class="btn-primary" data-pick-confirm ${!picker.club ? 'disabled style="opacity:0.5"' : ''}>추가</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="hole-detail">
      <div class="detail-grid">
        <div class="detail-block">
          <div class="detail-block-label">스코어</div>
          <div class="counter">
            <button class="counter-btn" data-cnt="score-" ${(h.score||0) <= 0 ? 'disabled' : ''}>−</button>
            <div class="counter-val">${h.score == null ? 0 : h.score}</div>
            <button class="counter-btn" data-cnt="score+">+</button>
          </div>
        </div>
        <div class="detail-block">
          <div class="detail-block-label">퍼팅</div>
          <div class="counter">
            <button class="counter-btn" data-cnt="putts-" ${(h.putts||0) <= 0 ? 'disabled' : ''}>−</button>
            <div class="counter-val">${h.putts == null ? 0 : h.putts}</div>
            <button class="counter-btn" data-cnt="putts+">+</button>
          </div>
        </div>
      </div>

      <div class="shots-section">
        <div class="picker-label">샷 기록 (선택)</div>
        ${shotsHtml}
        ${picker ? pickerHtml : `<button class="add-shot-btn" data-add-shot="${idx}">+ 샷 추가</button>`}
      </div>

      <div class="notes-block">
        <div class="picker-label">메모</div>
        <textarea class="notes-input" data-notes="${idx}" placeholder="이 홀에 대한 메모...">${h.notes || ''}</textarea>
      </div>
    </div>
  `;
}

function attachHoleDetailHandlers(root, round) {
  // Counters
  root.querySelectorAll('[data-cnt]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = state.expandedHole;
      const h = round.holes[idx];
      const v = btn.dataset.cnt;
      if (v === 'score+') h.score = (h.score || 0) + 1;
      if (v === 'score-' && (h.score || 0) > 0) h.score = h.score - 1;
      if (v === 'putts+') h.putts = (h.putts || 0) + 1;
      if (v === 'putts-' && (h.putts || 0) > 0) h.putts = h.putts - 1;
      save();
      render();
    });
  });

  // Add shot
  root.querySelectorAll('[data-add-shot]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      state.shotPicker = { holeIdx: parseInt(btn.dataset.addShot), club: null, result: null };
      render();
    });
  });

  // Picker chips
  root.querySelectorAll('[data-pick-club]').forEach(c => {
    c.addEventListener('click', (e) => {
      e.stopPropagation();
      state.shotPicker.club = c.dataset.pickClub;
      render();
    });
  });
  root.querySelectorAll('[data-pick-result]').forEach(c => {
    c.addEventListener('click', (e) => {
      e.stopPropagation();
      state.shotPicker.result = state.shotPicker.result === c.dataset.pickResult ? null : c.dataset.pickResult;
      render();
    });
  });
  root.querySelector('[data-pick-cancel]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    state.shotPicker = null;
    render();
  });
  root.querySelector('[data-pick-confirm]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!state.shotPicker.club) return;
    const idx = state.shotPicker.holeIdx;
    round.holes[idx].shots.push({
      club: state.shotPicker.club,
      result: state.shotPicker.result
    });
    state.shotPicker = null;
    save();
    render();
  });

  // Delete shot
  root.querySelectorAll('[data-shot-del]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const [holeIdx, shotIdx] = btn.dataset.shotDel.split('-').map(Number);
      round.holes[holeIdx].shots.splice(shotIdx, 1);
      save();
      render();
    });
  });

  // Notes
  root.querySelectorAll('[data-notes]').forEach(ta => {
    ta.addEventListener('click', e => e.stopPropagation());
    ta.addEventListener('input', () => {
      const idx = parseInt(ta.dataset.notes);
      round.holes[idx].notes = ta.value;
      save();
    });
  });
}

/* ---------- 통계 ---------- */
function renderStats(root) {
  const completed = state.rounds.filter(r => r.completed).slice().reverse(); // oldest first
  if (completed.length === 0) {
    root.innerHTML = `
      <div class="empty">
        <div class="empty-icon">S</div>
        <div class="empty-text">통계는 라운드를 마치면 표시됩니다.</div>
      </div>
    `;
    return;
  }

  const scores = completed.map(r => totalScore(r));
  const putts = completed.map(r => totalPutts(r));
  const best = Math.min(...scores);
  const avg = scores.reduce((a,b)=>a+b,0) / scores.length;
  const avgPutts = putts.reduce((a,b)=>a+b,0) / Math.max(1, putts.filter(p=>p>0).length);

  // Per-hole averages (using all completed rounds)
  const holeAvgs = state.settings.pars.map((par, i) => {
    const vals = completed.map(r => r.holes[i]?.score).filter(v => v != null);
    const avg = vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
    return { hole: i + 1, par, avg };
  });

  let html = `
    <div class="quick-stats">
      <div class="stat"><div class="stat-num">${best}</div><div class="stat-label">베스트</div></div>
      <div class="stat"><div class="stat-num">${avg.toFixed(1)}</div><div class="stat-label">평균</div></div>
      <div class="stat"><div class="stat-num">${isNaN(avgPutts) ? '—' : avgPutts.toFixed(1)}</div><div class="stat-label">평균 퍼팅</div></div>
    </div>
  `;

  // Score trend chart (line)
  if (completed.length >= 2) {
    html += `<div class="chart-card">
      <div class="chart-title">스코어 추이</div>
      <div class="chart-subtitle">최근 ${completed.length}개 라운드</div>
      ${lineChart(scores, totalPar(completed[0]))}
    </div>`;
  }

  // Per-hole bar chart
  html += `<div class="chart-card">
    <div class="chart-title">홀별 평균</div>
    <div class="chart-subtitle">파 대비 평균 스코어</div>
    ${holeBarChart(holeAvgs)}
  </div>`;

  root.innerHTML = html;
}

function lineChart(values, parTotal) {
  const w = 320, h = 160, pad = 28;
  const min = Math.min(...values, parTotal) - 1;
  const max = Math.max(...values, parTotal) + 1;
  const range = max - min || 1;
  const xStep = (w - pad * 2) / Math.max(1, values.length - 1);

  const points = values.map((v, i) => {
    const x = pad + i * xStep;
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return [x, y];
  });

  const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const parY = h - pad - ((parTotal - min) / range) * (h - pad * 2);

  return `
    <svg class="chart" viewBox="0 0 ${w} ${h}">
      <line x1="${pad}" y1="${parY}" x2="${w-pad}" y2="${parY}" stroke="var(--brass-soft)" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${w-pad}" y="${parY-4}" text-anchor="end" font-family="Fraunces" font-size="10" font-style="italic" fill="var(--brass)">par ${parTotal}</text>
      <path d="${path}" fill="none" stroke="var(--pine)" stroke-width="1.5"/>
      ${points.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--ivory)" stroke="var(--pine)" stroke-width="1.5"/>`).join('')}
      ${points.map((p, i) => `<text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-family="Fraunces" font-size="11" fill="var(--pine)">${values[i]}</text>`).join('')}
    </svg>
  `;
}

function holeBarChart(holeAvgs) {
  const w = 320, h = 160, pad = 24;
  const max = Math.max(...holeAvgs.map(h => h.avg || h.par)) + 0.5;
  const min = Math.min(...holeAvgs.map(h => h.par)) - 0.5;
  const range = max - min || 1;
  const barW = (w - pad * 2) / 9 * 0.7;
  const gap = (w - pad * 2) / 9;

  const bars = holeAvgs.map((d, i) => {
    const x = pad + i * gap + (gap - barW) / 2;
    const yPar = h - pad - ((d.par - min) / range) * (h - pad * 2);
    const yAvg = d.avg == null ? null : h - pad - ((d.avg - min) / range) * (h - pad * 2);
    let parts = `<line x1="${x - 2}" y1="${yPar}" x2="${x + barW + 2}" y2="${yPar}" stroke="var(--brass)" stroke-width="1" stroke-dasharray="2 2"/>`;
    if (yAvg != null) {
      const barH = (h - pad) - yAvg;
      const fill = d.avg > d.par ? 'var(--pine-soft)' : 'var(--brass)';
      parts += `<rect x="${x}" y="${yAvg}" width="${barW}" height="${barH}" fill="${fill}" rx="1"/>`;
      parts += `<text x="${x + barW/2}" y="${yAvg - 4}" text-anchor="middle" font-family="Fraunces" font-size="9" fill="var(--pine)">${d.avg.toFixed(1)}</text>`;
    }
    parts += `<text x="${x + barW/2}" y="${h - pad + 14}" text-anchor="middle" font-family="Pretendard Variable" font-size="10" fill="var(--muted)">${d.hole}</text>`;
    return parts;
  }).join('');

  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}

/* ---------- 설정 ---------- */
function renderSettings(root) {
  let html = `
    <div class="section">
      <div class="section-label">코스</div>
      <div class="card">
        <div class="setting-row">
          <div class="setting-label">코스 이름</div>
          <input class="setting-input wide" data-set="courseName" value="${state.settings.courseName || ''}" placeholder="예: 골프 클럽 이름">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">홀별 파</div>
      <div class="card">
  `;
  state.settings.pars.forEach((p, i) => {
    html += `
      <div class="setting-row">
        <div class="setting-label">${i + 1}번 홀</div>
        <input class="setting-input" data-par="${i}" type="number" min="3" max="6" value="${p}">
      </div>
    `;
  });
  html += `
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--muted);font-style:italic;font-family:var(--serif);">
        * 변경 사항은 다음 라운드부터 적용됩니다.
      </div>
    </div>

    <div class="section">
      <div class="section-label">데이터</div>
      <div class="card">
        <div class="setting-row">
          <div class="setting-label">전체 데이터 내보내기 (JSON)</div>
          <button class="btn-secondary" data-act="export">내보내기</button>
        </div>
        <div class="setting-row">
          <div class="setting-label" style="color:var(--danger);">전체 데이터 삭제</div>
          <button class="btn-secondary" style="color:var(--danger);border-color:var(--danger);" data-act="reset">삭제</button>
        </div>
      </div>
    </div>
  `;

  root.innerHTML = html;

  root.querySelector('[data-set="courseName"]').addEventListener('input', e => {
    state.settings.courseName = e.target.value;
    save();
  });
  root.querySelectorAll('[data-par]').forEach(input => {
    input.addEventListener('change', e => {
      const idx = parseInt(input.dataset.par);
      const v = parseInt(e.target.value);
      if (!isNaN(v) && v >= 3 && v <= 6) {
        state.settings.pars[idx] = v;
        save();
      } else {
        e.target.value = state.settings.pars[idx];
      }
    });
  });

  root.querySelector('[data-act="export"]')?.addEventListener('click', () => {
    const data = JSON.stringify({ rounds: state.rounds, settings: state.settings }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `greenbook-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
  root.querySelector('[data-act="reset"]')?.addEventListener('click', () => {
    confirmModal('모든 데이터를 삭제하시겠습니까?', '되돌릴 수 없습니다.', () => {
      state.rounds = [];
      state.currentRoundId = null;
      save();
      setView('home');
    }, true);
  });
}

/* ---------- 모달 ---------- */
function confirmModal(title, text, onConfirm, danger = false) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <div class="modal-title">${title}</div>
        <div class="modal-text">${text}</div>
        <div class="modal-actions">
          <button class="btn-secondary" data-modal="cancel">취소</button>
          <button class="${danger ? 'btn-danger' : 'btn-primary'}" data-modal="ok">확인</button>
        </div>
      </div>
    </div>
  `;
  root.querySelector('[data-modal="cancel"]').onclick = () => { root.innerHTML = ''; };
  root.querySelector('[data-modal="ok"]').onclick = () => { root.innerHTML = ''; onConfirm(); };
}

/* ============================================================
   초기화
   ============================================================ */
load();
render();
</script>
